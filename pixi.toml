[project]
name = "onnxruntime"
description = "onnxruntime"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
cmake = ">=3.30.2,<4"
make = "*"
ninja = "*"
numpy = "*"
pip = "*"
python = "*"
libdate = ">=3.0.1,<4"
c-compiler = ">=1.8.0,<2"
cxx-compiler = ">=1.8.0,<2"
libprotobuf = "3.21.*"
packaging = ">=24.1,<25"
setuptools = ">=75.6.0"

[feature.lint.dependencies]
# versions are based on requirements-lintrunner.txt
clang-format = ">=19.1.5"
ruff = ">=0.9.10"
black = "==24.2.0"
[feature.lint.pypi-dependencies]
lintrunner = ">=0.12.5"
lintrunner-adapters = ">=0.12.4"
[feature.lint.tasks]
lintrunner-init = "lintrunner init"
lintrunner-run = "lintrunner --all-files"

[tasks]
build-debug = "python tools/ci_build/build.py --update --build_wheel --enable_pybind --build_dir build --config Debug --build --parallel --cmake_extra_defines=CMAKE_CXX_STANDARD=17 --compile_no_warning_as_error"
install-debug = { cmd = "python -m pip install build/Debug/dist/onnxruntime*.whl", depends-on = ["build-debug"] }

build-release = "python tools/ci_build/build.py --update --build_wheel --enable_pybind --build_dir build --config Release --build --parallel --cmake_extra_defines=CMAKE_CXX_STANDARD=17 --compile_no_warning_as_error"
install-release = { cmd = "python -m pip install build/Release/dist/onnxruntime*.whl", depends-on = ["build-release"] }

[environments]
lint = ["lint"]
